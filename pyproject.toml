[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claimpulse-ai"
version = "1.0.0"
description = "Real-time multimodal AI insurance claim intake agent powered by Gemini Live"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Prakash Kudale", email = "prakashkudale23@gmail.com" }
]
keywords = [
    "insurance",
    "fnol",
    "multimodal",
    "gemini-live",
    "ai-agent",
    "voice-ai",
    "computer-vision",
    "adk"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "google-adk>=2.0.0a1",
    "google-genai>=2.24.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "typing-extensions>=4.12"
]

[project.urls]
Homepage = "https://github.com/prakashkudale/claimpulse-ai"
Repository = "https://github.com/prakashkudale/claimpulse-ai"
Issues = "https://github.com/prakashkudale/claimpulse-ai/issues"
